[project]
name = "daviwithclaude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: makes real Claude API calls, excluded by default (run with -m integration)",
]
