name: anfavea
on:
  push:
    branches: [claude/zealous-noether-s00gsw]
    paths: [anfavea-autoveiculos/scripts/**, .github/workflows/anfavea.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 pandas openpyxl matplotlib
      - run: python anfavea-autoveiculos/scripts/probe.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anfavea-autoveiculos
          git commit -m "anfavea: atualiza dados coletados" || exit 0
          git push
